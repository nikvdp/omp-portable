name: Verify OMP Lite
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    uses: ./.github/workflows/lite-candidate.yml
  nix:
    needs: candidate
    uses: ./.github/workflows/nix-check.yml
    with:
      candidate-tag: ${{ needs.candidate.outputs.tag }}
