name: Release OMP Lite
run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && 'Publish OMP Lite (manual)' || '' }}
on:
  push:
    branches: [main]
  schedule:
    - cron: '49 * * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a GitHub release after all Lite targets pass
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: omp-native-release
  cancel-in-progress: false
jobs:
  candidate:
    uses: ./.github/workflows/lite-candidate.yml
    with:
      check-existing: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
  publish:
    needs: candidate
    if: github.ref == 'refs/heads/main' && needs.candidate.outputs.needed == 'true' && (github.event_name != 'workflow_dispatch' || inputs.publish)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-locks
          path: config
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: build-lite-*
          merge-multiple: true
          path: dist
      - name: Validate all Lite targets and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py publish
      - name: Record Portable handoff
        id: handoff
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py handoff
      - name: Save exact published release inputs for Portable
        if: steps.handoff.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: portable-release-inputs
          overwrite: true
          path: |
            config/release.json
            config/upstream-lock.json
            config/portable-lock.json
            config/runtime-lock.json
            config/runtime-package.json
            config/runtime-bun.lock
          if-no-files-found: error
