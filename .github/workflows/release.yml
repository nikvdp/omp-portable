name: Release OMP Lite
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a GitHub release after all targets pass
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: omp-lite-release
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      needed: ${{ steps.release.outputs.needed }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Ensure GitHub CLI is available
        run: command -v gh || { sudo apt-get update && sudo apt-get install -y gh; }
      - name: Resolve upstream release and verify reviewed sources
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_EXISTING: ${{ github.event_name == 'schedule' || inputs.publish }}
        run: |
          if [ "$CHECK_EXISTING" = true ]; then
            python3 scripts/release.py prepare --check-existing
          else
            python3 scripts/release.py prepare
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.release.outputs.needed == 'true'
        with:
          name: upstream-lock
          path: config/upstream-lock.json
          if-no-files-found: error
  build:
    needs: prepare
    if: needs.prepare.outputs.needed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
          - runner: macos-15
            target: darwin-arm64
          - runner: macos-15-intel
            target: darwin-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: 1.98.1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: upstream-lock
          path: config
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install Rust
        shell: bash
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          fi
          export PATH="$HOME/.cargo/bin:$PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup toolchain install 1.98.1 --profile minimal --component clippy --component rustfmt
      - name: Check Rust
        run: |
          cargo fmt --all --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - name: Build and smoke test
        run: ./build.sh --target '${{ matrix.target }}' --strict-host
      - name: Verify extraction lifecycle
        run: python3 -m unittest discover -s tests -v
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lite-${{ matrix.target }}
          path: dist/omp-lite-*-${{ matrix.target }}*
          if-no-files-found: error
  publish:
    needs: [prepare, build]
    if: github.event_name == 'schedule' || inputs.publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: upstream-lock
          path: config
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: lite-*
          merge-multiple: true
          path: dist
      - name: Validate complete matrix and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py publish
