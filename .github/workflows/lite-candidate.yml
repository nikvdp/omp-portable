name: Build Lite candidate
on:
  workflow_call:
    inputs:
      check-existing:
        type: boolean
        default: false
    outputs:
      needed:
        value: ${{ jobs.prepare.outputs.needed }}
      tag:
        value: ${{ jobs.prepare.outputs.tag }}
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      needed: ${{ steps.release.outputs.needed }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Ensure GitHub CLI is available
        run: command -v gh || { sudo apt-get update && sudo apt-get install -y gh; }
      - name: Resolve latest upstream release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_EXISTING: ${{ inputs.check-existing }}
        run: |
          if [ "$CHECK_EXISTING" = true ]; then
            python3 scripts/release.py prepare --check-existing
          else
            python3 scripts/release.py prepare
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.release.outputs.needed == 'true'
        with:
          name: release-locks
          path: |
            config/upstream-lock.json
            config/portable-lock.json
            config/runtime-lock.json
            config/runtime-package.json
            config/runtime-bun.lock
          if-no-files-found: error
  build:
    needs: prepare
    if: needs.prepare.outputs.needed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
          - runner: macos-15
            target: darwin-arm64
          - runner: macos-15-intel
            target: darwin-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      RUSTUP_TOOLCHAIN: 1.98.1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-locks
          path: config
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install Rust
        env:
          BUILD_TARGET: ${{ matrix.target }}
          RUST_TARGET: ${{ matrix.target == 'linux-x64' && 'x86_64-unknown-linux-musl' || 'aarch64-unknown-linux-musl' }}
        shell: bash
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          fi
          export PATH="$HOME/.cargo/bin:$PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup toolchain install 1.98.1 --profile minimal --component clippy --component rustfmt
          if [[ "$BUILD_TARGET" == linux-* ]]; then
            rustup target add --toolchain 1.98.1 "$RUST_TARGET"
          fi
      - name: Install musl cross-compiler for static Linux launchers
        if: startsWith(matrix.target, 'linux-')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Check Rust
        run: |
          cargo fmt --all --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - name: Build and smoke test
        run: ./build.sh --edition lite --target '${{ matrix.target }}' --strict-host
      - name: Verify extraction lifecycle
        run: |
          python3 -m venv "$RUNNER_TEMP/omp-tests"
          "$RUNNER_TEMP/omp-tests/bin/pip" install zstandard==0.23.0
          "$RUNNER_TEMP/omp-tests/bin/python" -m unittest discover -s tests -v
      - uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # v32.0.0
        id: nix-setup
        continue-on-error: ${{ matrix.target == 'darwin-x64' }}
        timeout-minutes: 5
        with:
          # Nix 2.36 dropped the Intel macOS installer.
          install_url: ${{ matrix.target == 'darwin-x64' && 'https://releases.nixos.org/nix/nix-2.34.7/install' || '' }}
      - name: Verify downstream Nix install of the Lite candidate
        id: nix-verify
        if: steps.nix-setup.outcome == 'success'
        continue-on-error: ${{ matrix.target == 'darwin-x64' }}
        timeout-minutes: 25
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          version=${RELEASE_TAG#omp-v}
          version=${version%-r*}
          binary="$PWD/dist/omp-lite-$version-$BUILD_TARGET"
          nix-store --add-fixed sha256 "$binary"
          candidate="$RUNNER_TEMP/nix-candidate"
          mkdir -p "$candidate/config" "$candidate/scripts" "$candidate/tests"
          cp flake.nix flake.lock "$candidate/"
          cp scripts/extract_lite.py "$candidate/scripts/"
          cp tests/test_extract_lite.py "$candidate/tests/"
          python3 - "$candidate/config/nix-release.json" "$RELEASE_TAG" "$version" "$BUILD_TARGET" "$binary.sha256" <<'PY'
          import json, sys
          from pathlib import Path
          pin, tag, version, target, checksum = sys.argv[1:]
          Path(pin).write_text(json.dumps({
              "version": version, "release": tag,
              "hashes": {target: Path(checksum).read_text().split()[0]},
          }))
          PY
          candidate=$(cd "$candidate" && pwd -P)
          nix profile add --profile "$RUNNER_TEMP/omp-nix-profile" --no-write-lock-file "path:$candidate#omp"
          home="$RUNNER_TEMP/omp-nix-home"
          mkdir -p "$home"
          actual=$(HOME="$home" "$RUNNER_TEMP/omp-nix-profile/bin/omp" --version)
          echo "$actual"
          test "$actual" = "omp/$version"
      - name: Report advisory Intel macOS Nix failure
        if: matrix.target == 'darwin-x64' && (steps.nix-setup.outcome == 'failure' || steps.nix-verify.outcome == 'failure')
        run: echo '::warning::Intel macOS Nix validation failed. The native Lite build and tests passed; the release is not blocked.'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-lite-${{ matrix.target }}
          path: dist/omp-lite-*-${{ matrix.target }}*
          if-no-files-found: error
