name: Portable best effort
on:
  workflow_run:
    workflows: [Release OMP Lite]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
concurrency:
  group: omp-portable-${{ github.event.workflow_run.id }}
  cancel-in-progress: false
jobs:
  portable:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event != 'pull_request' && github.event.workflow_run.head_repository.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
          - runner: macos-15
            target: darwin-arm64
          - runner: macos-15-intel
            target: darwin-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: write
      actions: read
    env:
      RUSTUP_TOOLCHAIN: 1.98.1
      RELEASE_SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
      BUILD_TARGET: ${{ matrix.target }}
    steps:
      - name: Check out exact Lite source
        id: source
        continue-on-error: true
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Download exact published Lite inputs
        id: inputs
        if: steps.source.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          LITE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          gh run download "$LITE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name portable-release-inputs --dir "$RUNNER_TEMP/lite-inputs"
          cp "$RUNNER_TEMP/lite-inputs/"* config/
      - name: Set up Python
        id: python
        if: steps.inputs.outcome == 'success'
        continue-on-error: true
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Build and strictly verify Portable
        id: build
        if: steps.python.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 80
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/release.py check-handoff
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          fi
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup toolchain install 1.98.1 --profile minimal --component clippy --component rustfmt
          if [[ "$BUILD_TARGET" == linux-* ]]; then
            rustup target add --toolchain 1.98.1 ${{ matrix.target == 'linux-x64' && 'x86_64-unknown-linux-musl' || 'aarch64-unknown-linux-musl' }}
            sudo apt-get update
            sudo apt-get install -y musl-tools
          fi
          cargo fmt --all --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          ./build.sh --edition portable --target "$BUILD_TARGET" --strict-host
          python3 -m venv "$RUNNER_TEMP/omp-tests"
          "$RUNNER_TEMP/omp-tests/bin/pip" install zstandard==0.23.0
          "$RUNNER_TEMP/omp-tests/bin/python" -m unittest discover -s tests -v
      - name: Append only verified Portable assets
        id: publish
        if: steps.build.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py publish-portable --target "$BUILD_TARGET"
      - name: Retain Portable build evidence
        if: steps.build.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: portable-${{ matrix.target }}
          path: dist/omp-portable-*-${{ matrix.target }}*
          if-no-files-found: error
      - name: Report best-effort outcome
        if: always()
        env:
          SOURCE_OUTCOME: ${{ steps.source.outcome }}
          INPUTS_OUTCOME: ${{ steps.inputs.outcome }}
          PYTHON_OUTCOME: ${{ steps.python.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        run: |
          {
            echo "### Portable $BUILD_TARGET (best effort)"
            echo "Lite publication is independent and unchanged."
            echo "Source: $SOURCE_OUTCOME; published inputs: $INPUTS_OUTCOME; Python: $PYTHON_OUTCOME"
            echo "Strict build/tests: $BUILD_OUTCOME; append assets: $PUBLISH_OUTCOME"
            echo "Dry runs and duplicate Lite releases have no publication handoff; Portable is skipped."
          } >> "$GITHUB_STEP_SUMMARY"
