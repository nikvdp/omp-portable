[workspace]
members = ["crates/sfx-format", "crates/sfx-pack", "crates/sfx-stub"]
resolver = "2"

[workspace.dependencies]
anyhow = "1"
sha2 = { version = "0.10", features = ["asm"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
zstd = "0.13"
fs2 = "0.4"
libc = "0.2"

[profile.release]
strip = true
lto = true
codegen-units = 1
